[project]
name = "ml-model-dojo"
version = "0.9.0"
description = "An interactive desktop lab for choosing machine learning models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "pandas>=2.1,<3",
    "joblib>=1.3",
    "matplotlib>=3.8,<4",
    "PySide6-Essentials>=6.6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
ml-model-dojo = "ml_model_dojo.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
